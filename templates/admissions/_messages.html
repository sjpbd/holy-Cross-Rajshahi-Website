{% if messages %}
<div class="mb-6 space-y-2">
    {% for message in messages %}
    <div class="rounded-xl px-4 py-3 text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-100{% elif message.tags == 'warning' %}bg-amber-50 text-amber-900 border border-amber-100{% else %}bg-emerald-50 text-emerald-800 border border-emerald-100{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
