<div class="adm-nav">
    {% if step > 1 %}
    <a class="adm-ghost" href="?step={{ prev_step }}"><i class="fas fa-arrow-left text-xs"></i> Back</a>
    {% else %}
    <a class="adm-ghost" href="{% url 'admissions:landing' %}"><i class="fas fa-arrow-left text-xs"></i> Admission home</a>
    {% endif %}
    <button type="submit" class="btn btn-primary">
        {{ submit_label|default:"Save and continue" }}
        <i class="fas fa-arrow-right ml-2 text-xs"></i>
    </button>
</div>
